syntax = "proto3";

package mankool.mcbot.protocol;

// Avoids a Java name clash with com.mojang.blaze3d.platform.Window in the mod
option java_outer_classname = "WindowProto";

// Game window placement. All coordinates are in GLFW screen coordinates and, for window
// rectangles, describe the OUTER frame (decorations included) relative to the top-left of the
// target monitor's work area - the natural units for tiling, since frames must not overlap.

message MonitorInfo {
  string name = 1;          // GLFW monitor name: RandR/wl_output name on Linux ("DP-1"), adapter on Windows
  bool primary = 2;
  int32 x = 3;              // Full monitor rect in screen coordinates
  int32 y = 4;
  int32 width = 5;
  int32 height = 6;
  int32 work_x = 7;         // Work area (minus panels/taskbar), also in screen coordinates
  int32 work_y = 8;
  int32 work_width = 9;
  int32 work_height = 10;
}

// Manager -> Client: move, resize, or (un)minimize the game window. Every field is optional;
// unset fields keep their current value. The client answers with a WindowStateResponse.
message SetWindowCommand {
  string monitor = 1;         // Target monitor name; empty = the monitor the window is on now
  optional int32 x = 2;       // Frame position relative to the monitor's work area
  optional int32 y = 3;
  optional int32 width = 4;   // Frame size
  optional int32 height = 5;
  optional bool minimized = 6;
}

// Manager -> Client: report the window state without changing it.
message GetWindowStateCommand {}

// Client -> Manager: the window's current state. Sent unsolicited once after the handshake
// (request_id empty) and in reply to SetWindowCommand / GetWindowStateCommand.
message WindowStateResponse {
  string request_id = 1;      // Echoes the request's message_id; empty for the post-handshake report
  string platform = 2;        // GLFW platform: "x11", "wayland", "win32", "cocoa"
  bool can_move = 3;          // false on native Wayland, where clients cannot position windows
  string monitor = 4;         // Monitor the window is on (largest overlap)
  int32 x = 5;                // Frame rect relative to that monitor's work area
  int32 y = 6;
  int32 width = 7;
  int32 height = 8;
  bool minimized = 9;
  bool focused = 10;
  repeated MonitorInfo monitors = 11;
}
