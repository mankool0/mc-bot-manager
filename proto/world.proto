syntax = "proto3";

package mankool.mcbot.protocol;

import "common.proto";

// World-related messages for chunk data and block interactions

// Block registry synchronization
// Client queries manager to see if it has this data version
message QueryBlockRegistryMessage {
  int32 data_version = 1;         // Minecraft data version (e.g., 3465 for 1.20.1)
  int32 protocol_version = 2;     // Minecraft protocol version (optional)
}

// Manager's response to block registry query
enum RegistryStatus {
  HAVE_IT = 0;                    // Manager already has this registry
  NEED_IT = 1;                    // Manager needs the full registry
}

message BlockRegistryResponse {
  RegistryStatus status = 1;
}

// Full block state registry (sent if manager doesn't have it)
message BlockRegistryMessage {
  int32 data_version = 1;         // Data version for this registry
  map<uint32, string> state_map = 2;  // state_id -> "minecraft:stone[facing=north]"
  map<uint32, uint32> face_masks = 3;  // state_id -> 6-bit bitmask: bit0=DOWN,bit1=UP,bit2=NORTH,bit3=SOUTH,bit4=WEST,bit5=EAST
}

// Command to interact with a block (right-click)
message InteractWithBlockCommand {
  BlockPos position = 1;
  Hand hand = 2;                  // Which hand to use (from common.proto)
  bool sneak = 3;                 // Whether to sneak while interacting
  bool look_at_block = 4;         // Whether to rotate to look at the block before interacting
  BlockFace face = 5;             // If non-zero, bypasses raytrace and clicks the specified face directly
}

// One reach query: is the block visible via raytrace from the player's eye position. Only ever
// sent as an element of CanReachBlocksCommand; the manager expresses a single check as a batch
// of one.
message CanReachBlockCommand {
  BlockPos position = 1;
  bool sneak = 2;
  optional BlockPos from_position = 3;  // If set, simulate reach from this floor position instead of current player pos
  BlockFace face = 4;                   // If non-AUTO, only check the specific face (default AUTO checks all faces)
}

message CanReachBlocksCommand {
  repeated CanReachBlockCommand queries = 1;
}

message CanReachBlocksResponse {
  string request_id = 1;          // Echoes the request's message_id for correlation
  // One entry per query actually evaluated, in request order. A list shorter than the request
  // (in practice: empty) means the client could not evaluate the batch, e.g. the bot is not in
  // a world; the manager treats that as an error rather than guessing at the remainder.
  repeated bool reachable = 2;
}

// Chunk data synchronization (Client -> Manager)
message ChunkDataMessage {
  int32 chunk_x = 1;              // Chunk X coordinate
  int32 chunk_z = 2;              // Chunk Z coordinate
  string dimension = 3;           // Dimension ID (e.g., "minecraft:overworld")
  int32 min_y = 4;                // Minimum Y for this world
  int32 max_y = 5;                // Maximum Y for this world
  repeated ChunkSection sections = 6;  // All sections in this chunk
  repeated bytes block_entity_nbt = 7; // Raw binary compound payloads for block entities in this chunk
}

// Single chunk section (16x16x16 blocks)
message ChunkSection {
  int32 section_y = 1;            // Y index of this section
  repeated uint32 palette = 2 [packed = true];    // Block state IDs from Minecraft's global registry
  repeated uint32 block_indices = 3 [packed = true];  // Indices into palette (YZX order: y*256 + z*16 + x)
  bool uniform = 4;               // If true, entire section is palette[0]
  repeated string biome_palette = 5;              // Biome resource IDs (e.g. "minecraft:plains")
  repeated uint32 biome_indices = 6 [packed = true];  // 64 entries (4x4x4 grid, index = y*16 + z*4 + x); omitted if biome_uniform
  bool biome_uniform = 7;         // If true, entire section is biome_palette[0]
  bytes block_light = 8;          // 2048-byte nibble array (4 bits per block, YZX order); empty if not present
  bytes sky_light = 9;            // 2048-byte nibble array; empty in nether/end or if not present
}

// A single section's light data within a light update
message LightSection {
  int32 section_y = 1;            // Absolute section Y index
  bytes data = 2;                 // 2048-byte nibble array; empty means clear this section to zero
}

// Incremental light update for a chunk (Client -> Manager)
message LightUpdateMessage {
  int32 chunk_x = 1;
  int32 chunk_z = 2;
  string dimension = 3;
  repeated LightSection sky_sections = 4;    // Sky light section updates
  repeated LightSection block_sections = 5;  // Block light section updates
}

// Single block update (Client -> Manager)
message BlockUpdateMessage {
  BlockPos position = 1;
  uint32 state_id = 2;            // Block state ID from Minecraft's global registry
  string dimension = 3;           // Dimension ID
}

// One block entity changed (Client -> Manager). Chunk data carries every block entity in a chunk,
// but only at load; this is how an edited sign, a re-dyed banner or a newly placed chest reaches the
// manager without waiting for the chunk to cycle. `nbt` is the same saveWithFullMetadata payload
// ChunkDataMessage.block_entity_nbt carries, so both paths store the same shape.
message BlockEntityUpdateMessage {
  BlockPos position = 1;
  string dimension = 2;
  bytes nbt = 3;
}

// Multi-block update (Client -> Manager)
message MultiBlockUpdateMessage {
  repeated BlockPos positions = 1;
  repeated uint32 state_ids = 2 [packed = true];  // Same length as positions
  string dimension = 3;
}

// Chunk unload notification (Client -> Manager)
message ChunkUnloadMessage {
  int32 chunk_x = 1;
  int32 chunk_z = 2;
  string dimension = 3;
}

// Query the current hold-attack state from the client
message GetHoldAttackStatusCommand {}

message HoldAttackStatusResponse {
  string request_id = 1;          // Echoes the request's message_id for correlation
  bool enabled = 2;
}

// Command to hold or release the attack (left-click) button in-game.
message HoldAttackCommand {
  bool enabled = 1;
  int32 duration_ticks = 2;
}

// Weather state update (Client -> Manager)
message WeatherUpdate {
  bool is_raining = 1;       // True if it is raining
  bool is_thundering = 2;    // True if there is thunder
  float rain_level = 3;      // Rain intensity 0.0 to 1.0
  float thunder_level = 4;   // Thunder intensity 0.0 to 1.0
}

// Map item data (Client -> Manager), mirrors ClientboundMapItemDataPacket
message MapDataMessage {
  int32 map_id = 1;
  int32 scale = 2;            // Zoom level 0-4
  bool locked = 3;
  string dimension = 4;       // Current level dimension at time of receipt
  bool has_patch = 5;         // Whether color patch data is present
  int32 patch_x = 6;          // Top-left X of the patch (0-127)
  int32 patch_z = 7;          // Top-left Z of the patch (0-127)
  int32 patch_width = 8;
  int32 patch_height = 9;
  bytes patch_colors = 10;    // patch_width * patch_height color bytes
}
