syntax = "proto3";

package mankool.mcbot.protocol;

import "common.proto";

message EntityData {
  int32  entity_id   = 1;
  string uuid        = 2;
  string type        = 3;   // "minecraft:item", "minecraft:zombie", etc.
  double x           = 4;
  double y           = 5;
  double z           = 6;
  float  yaw         = 7;
  float  pitch       = 8;
  double vel_x       = 9;
  double vel_y       = 10;
  double vel_z       = 11;
  bool   is_living   = 12;
  float  health      = 13;
  float  max_health  = 14;
  bool      is_item    = 15;
  ItemStack item_stack = 16;
  bool   is_player   = 17;
  string player_name = 18;
  int32  owner_entity_id = 19; // Projectiles only
  string owner_uuid      = 20;
  // Items, XP orbs, projectiles and the like: rarely still there once out of view.
  bool short_lived = 21;
  string custom_name = 22; // Plain text, empty when unnamed
  // The entity's full NBT as the client holds it (saveWithoutId: no "id"), a compound payload
  // with no root header. Only when it changed since the last one sent for this entity, so
  // empty means "as before"; never for players or short-lived entities.
  bytes nbt = 23;
}

message EntityUpdate {
  string              dimension    = 1;
  repeated EntityData upserted     = 2;
  // Out of tracking range, chunk unloaded, level left: the entity may still exist.
  repeated int32 gone_from_view_ids = 3 [packed = true];
  // Its last reported health was 0; the server removes a dying entity a second later.
  repeated int32 died_ids = 4 [packed = true];
}
